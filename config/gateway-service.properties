eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.server.webmvc.enabled=true
spring.cloud.gateway.server.webmvc.x-forwarded-request-headers-filter.enabled=true
spring.cloud.gateway.server.webmvc.trusted-proxies=.*

spring.cloud.gateway.server.webmvc.routes[0].id=user-service-route
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0].name=Path
spring.cloud.gateway.server.webmvc.routes[0].predicates[0].args._genkey_0=/api/users
spring.cloud.gateway.server.webmvc.routes[0].predicates[0].args._genkey_1=/api/users/**

spring.cloud.gateway.server.webmvc.routes[1].id=notification-service-route
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0].name=Path
spring.cloud.gateway.server.webmvc.routes[1].predicates[0].args._genkey_0=/api/notification
spring.cloud.gateway.server.webmvc.routes[1].predicates[0].args._genkey_1=/api/notification/**

resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.slidingWindowSize=2
resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.minimumNumberOfCalls=2
resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.waitDurationInOpenState=15s
resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.permittedNumberOfCallsInHalfOpenState=1
resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true

resilience4j.circuitbreaker.instances.notificationServiceCircuitBreaker.slidingWindowSize=2
resilience4j.circuitbreaker.instances.notificationServiceCircuitBreaker.minimumNumberOfCalls=2
resilience4j.circuitbreaker.instances.notificationServiceCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.notificationServiceCircuitBreaker.waitDurationInOpenState=15s
resilience4j.circuitbreaker.instances.notificationServiceCircuitBreaker.permittedNumberOfCallsInHalfOpenState=1
resilience4j.circuitbreaker.instances.notificationServiceCircuitBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.env.show-values=ALWAYS

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.cloud.loadbalancer=DEBUG
logging.level.io.github.resilience4j=DEBUG
logging.level.io.github.resilience4j.circuitbreaker=DEBUG