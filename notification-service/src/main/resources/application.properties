spring.application.name=notification-service
server.port=8088

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.prilepskiy_ae.notification.dto.event.UserEventDto
spring.kafka.consumer.properties.spring.json.trusted.packages=com.prilepskiy_ae.notificationservice.dto.event

app.kafka.topic.user-events=user-events

# SMTP для Gmail (SSL, порт 465)
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_LOGIN}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=smtps

# Дополнительные свойства для smpts
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Кастомные настройки (читаются через @Value в коде)
app.mail.from-address=${MAIL_LOGIN}
app.mail.site-url=https://example.com
